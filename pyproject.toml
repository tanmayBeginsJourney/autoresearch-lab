[project]
name = "autoresearch-lab"
version = "0.1.0"
description = "researchctl (cluster + research-record CLI) and labkit (in-job run harness)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
researchctl = "researchctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchctl", "src/labkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
