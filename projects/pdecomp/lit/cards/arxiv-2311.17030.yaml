id: arxiv:2311.17030
title: "Is This the Subspace You Are Looking for? An Interpretability Illusion for Subspace Activation Patching"
authors: [Aleksandar Makelov, Georg Lange, Neel Nanda]   # ICLR 2024 version adds Atticus Geiger per proceedings listing
year: 2023
venue: ICLR 2024
depth: abstract   # not full text
question: When a subspace patch changes model behavior as intended, is it because the subspace encodes the feature?
hypothesis: Patching can succeed through a dormant pathway (activates a different route), giving a causal-looking but misleading result.
claims:
  - text: Subspace patching (incl. DAS-style learned subspaces) can produce the intended end-to-end behavior change via a dormant pathway, not the studied feature.
    evidence: ICLR proceedings / MATS summary
    strength: strong (published, venue-reviewed)
    concerns: Reply paper arXiv:2401.12631 disputes the framing; not yet read.
  - text: Subspace patching is not inherently unfit; IOI is a success case; rank-1 fact editing in factual recall linked to the illusion.
    evidence: MATS summary
    strength: moderate
skeptic: "Shows that \"behavior changed as predicted\" is insufficient evidence of mechanism when the intervention is optimized. Direct analogy: PD adversarial/optimized masks could succeed or fail through off-manifold pathways."
relevance: "Template for an \"illusion test\" for PD: separate mask effects on the mechanism of interest from off-distribution/dormant-path effects."
links: [arxiv:2303.02536, arxiv:2401.12631, arxiv:2610.20748]
