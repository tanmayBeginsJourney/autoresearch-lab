# uv env "kernels": researchctl env sync kernels  (venv lives in $LAB_ROOT/venvs/kernels, never in the repo)
# torch comes from the CUDA 12.8 index: needed for Blackwell (sm_120) RTX PRO slices, fine on H200 (sm_90).
[project]
name = "lab-env-kernels"
version = "0"
requires-python = ">=3.11,<3.14"
dependencies = ["torch>=2.8", "triton>=3.4", "ninja", "numpy", "pytest", "nvidia-cuda-nvcc-cu12>=12.8", "nvidia-cuda-runtime-cu12>=12.8", "autoresearch-lab"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
autoresearch-lab = { path = "../..", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
